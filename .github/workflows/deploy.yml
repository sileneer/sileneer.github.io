name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Pushes the built site to the gh-pages branch (kept as the deployment
# history of the GitHub Pages copy — one commit per deploy).
permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish build/ to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          npx gh-pages -d build --message "Deploy ${GITHUB_SHA::7}"
